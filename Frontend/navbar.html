<script>
  function setLoginRedirect() {
    const loginButton = document.getElementById('login-button-navbar');
    const currentPage = window.location.pathname.split('/').pop().toLowerCase(); // Gets filename in lowercase
    
    console.log("Current page:", currentPage); // Fixed console.log
    
    if (currentPage === 'patienthome.html') {
      loginButton.href = 'PatientProfile.html';
      console.log("Redirecting to PatientProfile.html");
    } 
    else if (currentPage === 'doctorhome.html') {
      loginButton.href = 'javascript:void(0)';
      loginButton.onclick = (e) => {
        e.preventDefault();
        alert("Doctors don't need to login here.");
      };
      console.log("Doctor home - login disabled");
    } 
    else {
      loginButton.href = 'index.html';
      console.log("Redirecting to index.html");
    }
  }

  // Run when DOM is ready
  document.addEventListener('DOMContentLoaded', setLoginRedirect);
</script>
