<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doctor Home</title>
  <link rel="stylesheet" href="chat.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header input[type="search"] {
      flex-grow: 1;
      padding: 8px 12px;
      border-radius: 4px;
      border: none;
      font-size: 16px;
    }
    main {
      flex-grow: 1;
      display: flex;
      overflow: hidden;
    }
    #left-pane {
      width: 320px;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
    }
    #profile-details label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    #profile-details input,
    #profile-details select {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #profile-picture {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    #left-pane-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    #left-pane-buttons button {
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #edit-btn {
      background-color: #007bff;
      color: white;
    }
    #save-btn {
      background-color: #28a745;
      color: white;
      display: none;
    }
    #signout-btn {
      background-color: #dc3545;
      color: white;
    }
    #right-pane {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #calendar-header {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    #calendar-header select {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: white;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      flex-grow: 1;
    }
    .calendar-day {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
      min-height: 60px;
    }
    .date-number {
      font-weight: bold;
    }
    #amount-collected {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border-radius: 4px;
      font-size: 16px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
 <div id="navbar"></div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
      // Now wait until doctor profile is fetched, then update
      // You’ll define this function below
    });
</script>



  <header>
    <input type="search" id="patient-search" placeholder="Search patients..." />
  </header>

  <main>
    <section id="left-pane">
      <div id="profile-details">
        <img id="profile-picture" src="images/doctor.png" alt="Doctor Photo" />
        <label for="name">Name</label>
        <input type="text" id="name" disabled />
        <label for="specialization">Specialization</label>
        <input type="text" id="specialization" disabled />
        <label for="address">Address</label>
        <input type="text" id="address" disabled />
        <label for="fees">Fees</label>
        <input type="number" id="fees" disabled />
        <label for="age">Age</label>
        <input type="number" id="age" disabled />
        <label for="availability">Availability</label>
        <select id="availability" disabled>
          <option value="available">Available</option>
          <option value="not-available">Not Available</option>
        </select>
      </div>
      <div id="left-pane-buttons">
        <button id="edit-btn">Edit</button>
        <button id="save-btn">Save</button>
        <button id="signout-btn">Sign Out</button>
      </div>
    </section>

    <section id="right-pane">
      <div id="amount-collected">Amount Collected This Year: ₹0</div>
      <div id="calendar-header">
        <select id="month-select"></select>
        <select id="year-select"></select>
      </div>
      <div id="calendar"></div>
    </section>
  </main>
  <script type="module"> 
   import { API_BASE_URL } from './config.js';

  async function loadNavbarAndDoctor() {
    const navbarDiv = document.getElementById("navbar");
    const token = localStorage.getItem("access");

    if (!navbarDiv) return;

    try {
      // Step 1: Load navbar.html
      const navbarHTML = await fetch("navbar.html").then(res => res.text());
      navbarDiv.innerHTML = navbarHTML;

      // Step 2: Wait for DOM to update before manipulating elements
      await new Promise(resolve => setTimeout(resolve, 50));

      // Step 3: Replace Login button text if user is logged in
      const authButton = document.querySelector(".auth-button-navbar");
      if (!token || !authButton) return;

      const baseURL = API_BASE_URL
      const response = await fetch(`${baseURL}/doctor/home/`, {
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        }
      });

      if (!response.ok) throw new Error("Invalid token");

      const data = await response.json();

      // Step 4: Replace the button text
      authButton.textContent = `Welcome, Dr. ${data.name}`;
      
      
    } catch (err) {
      console.warn("Doctor fetch failed:", err);
      localStorage.removeItem("access");
    }
  }

  document.addEventListener("DOMContentLoaded", loadNavbarAndDoctor);
</script>


  <script>
    
    const profileFields = ['name', 'specialization', 'address', 'fees', 'age', 'availability'];
    
    const profilePictureEl = document.getElementById('profile-picture');
    const amountCollectedEl = document.getElementById('amount-collected');
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const signoutBtn = document.getElementById('signout-btn');
    let isEditing = false;
    let doctorProfile = {};

    function renderProfileFields() {
      profilePictureEl.src = "images/doctor.png";
      profileFields.forEach(field => {
        const input = document.getElementById(field);
        if (input) {
          input.value = doctorProfile[field];
          input.disabled = !isEditing;
        }
      });
    }

    function updateAmountCollected(amount) {
      amountCollectedEl.textContent = `Amount Collected This Year: ₹${amount.toLocaleString()}`;
    }

    function toggleEditing(editing) {
      isEditing = editing;
      profileFields.forEach(field => {
        const input = document.getElementById(field);
        if (input) input.disabled = !editing;
      });
      editBtn.style.display = editing ? 'none' : 'inline-block';
      saveBtn.style.display = editing ? 'inline-block' : 'none';
    }

    function saveProfile() {
      profileFields.forEach(field => {
        const input = document.getElementById(field);
        if (input) doctorProfile[field] = input.value;
      });
      toggleEditing(false);
      alert('Profile updated (mock only).');
    }
 
    function loadDoctorProfile() {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const BASE_URL = isLocalhost ? 'http://127.0.0.1:8000' : 'http://13.218.59.50';
      const token = localStorage.getItem('access');

      if (!token) {
        alert('You are not logged in.');
        window.location.href = '/Frontend/login.html';
        return;
      }

      fetch(`${BASE_URL}/doctor/home/`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(res => {
        if (!res.ok) throw new Error("Unauthorized");
        return res.json();
      })
      .then(data => {
        doctorProfile = {
          name: data.name,
          specialization: data.specialization,
          address: data.address,
          fees: data.fees,
          age: data.age,
          availability: data.availability.toString()
        };
        renderProfileFields();
   
      })
    //   .catch(err => {
    //     console.error(err);
    //     alert('Failed to load doctor profile.');
    //     window.location.href = '/Frontend/login.html';
    //   });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDoctorProfile();

      editBtn.addEventListener('click', () => toggleEditing(true));
      saveBtn.addEventListener('click', saveProfile);
      signoutBtn.addEventListener('click', () => {
        localStorage.removeItem('access');
        window.location.href = '/Frontend/index.html';
      });

      // Dummy calendar logic
      const monthSelect = document.getElementById('month-select');
      const yearSelect = document.getElementById('year-select');
      const calendarEl = document.getElementById('calendar');

      function populateMonthYear() {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        months.forEach((m, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.text = m;
          monthSelect.appendChild(opt);
        });

        const year = new Date().getFullYear();
        for (let y = year - 2; y <= year + 2; y++) {
          const opt = document.createElement('option');
          opt.value = y;
          opt.text = y;
          yearSelect.appendChild(opt);
        }

        monthSelect.value = new Date().getMonth();
        yearSelect.value = year;
      }

      function renderCalendar(month, year) {
        calendarEl.innerHTML = '';
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
          const cell = document.createElement('div');
          cell.className = 'calendar-day';
          cell.innerHTML = `<div class="date-number">${d}</div>`;
          calendarEl.appendChild(cell);
        }
      }

      monthSelect.addEventListener('change', () => {
        renderCalendar(+monthSelect.value, +yearSelect.value);
      });

      yearSelect.addEventListener('change', () => {
        renderCalendar(+monthSelect.value, +yearSelect.value);
      });

      populateMonthYear();
      renderCalendar(new Date().getMonth(), new Date().getFullYear());
    });
  </script>
 
</body>
</html>
