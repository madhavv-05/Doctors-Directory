<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor's Directory - Sign in with Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 0 auto;
            width: fit-content;
        }
        .google-btn:hover {
            background-color: #f5f5f5;
        }
        .google-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }
        #user-info {
            margin-top: 30px;
            font-size: 14px;
            color: #444;
            word-wrap: break-word;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h2>Sign in with Google</h2>
        <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID"
            data-login_uri=""
            data-auto_prompt="false">
        </div>
        <div class="google-btn" id="googleSignInBtn">
            <img src="images/google.png" alt="Google Icon" />
            <span>Sign in with Google</span>
        </div>
        <div id="user-info"></div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            // Decode JWT token to get user info
            const data = parseJwt(response.credential);
            const userInfoDiv = document.getElementById('user-info');
            userInfoDiv.innerHTML = `
                <p><strong>Signed in as:</strong> ${data.name}</p>
                <p><strong>Email:</strong> ${data.email}</p>
                <img src="${data.picture}" alt="User Picture" style="border-radius: 50%; width: 80px; height: 80px;"/>
            `;
            // Here you can also send the token to your backend for verification and session creation
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: 'YOUR_GOOGLE_CLIENT_ID',
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById('googleSignInBtn'),
                { theme: 'outline', size: 'large' }  // customization attributes
            );
            google.accounts.id.prompt(); // also display the One Tap dialog
        };
    </script>
</body>
</html>
