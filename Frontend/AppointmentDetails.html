<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Appointment Details</title>
    <link rel="stylesheet" href="NavBar.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7fa;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 30px;
            border-left: 5px solid #007bff;
        }
        h2 {
            color: #2d3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .detail {
            margin-bottom: 15px;
            font-size: 16px;
            color: #555;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 0;
        }
        .detail span.label {
            font-weight: bold;
            color: #333;
        }
        .prescription-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 10px;
        }
        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .back-button {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Appointment Details</h2>
        <div class="detail"><span class="label">Appointment ID:</span> <span id="appointmentId"></span></div>
        <div class="detail"><span class="label">Doctor Name:</span> <span id="doctorName"></span></div>
        <div class="detail"><span class="label">Patient Name:</span> <span id="patientName"></span></div>
        <div class="detail"><span class="label">Date:</span> <span id="appointmentDate"></span></div>
        <div class="detail"><span class="label">Time Slot:</span> <span id="timeSlot"></span></div>
        <div class="detail"><span class="label">Status:</span> <span id="status"></span></div>
        <div class="detail"><span class="label">Prescription:</span> 
            <span id="prescription">
                <img id="prescriptionImage" src="" alt="Prescription" class="prescription-image" onerror="this.style.display='none'; this.nextSibling.textContent='N/A';" />
                <span id="prescriptionText" style="display:inline;">N/A</span>
            </span>
        </div>
        <div class="detail"><span class="label">Medium:</span> <span id="medium"></span></div>
        <div class="button-container">
            <button class="back-button" onclick="window.history.back();">Back to Profile</button>
        </div>
    </div>
<script>
    const appointmentDetails = {
        appointmentId: "12345",
        doctorName: "Dr. Smith",
        patientName: "John Doe",
        appointmentDate: "2023-10-15",
        timeSlot: "10:00 AM",
        status: "Online",
        prescriptionImageSrc: "path/to/prescription_image.jpg",
        prescriptionText: "N/A",
        medium: "Video Call"
    };

    function renderAppointmentDetails() {
        document.getElementById("appointmentId").textContent = appointmentDetails.appointmentId;
        document.getElementById("doctorName").textContent = appointmentDetails.doctorName;
        document.getElementById("patientName").textContent = appointmentDetails.patientName;
        document.getElementById("appointmentDate").textContent = appointmentDetails.appointmentDate;
        document.getElementById("timeSlot").textContent = appointmentDetails.timeSlot;
        document.getElementById("status").textContent = appointmentDetails.status;
        const prescriptionImage = document.getElementById("prescriptionImage");
        const prescriptionText = document.getElementById("prescriptionText");
        if (appointmentDetails.prescriptionImageSrc) {
            prescriptionImage.src = appointmentDetails.prescriptionImageSrc;
            prescriptionImage.style.display = "inline";
            prescriptionText.style.display = "none";
        } else {
            prescriptionImage.style.display = "none";
            prescriptionText.textContent = appointmentDetails.prescriptionText;
            prescriptionText.style.display = "inline";
        }
        document.getElementById("medium").textContent = appointmentDetails.medium;
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderAppointmentDetails();
    });
</script>
</body>
</html>
