<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Directory - Register</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            display: flex;
            width: 70%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 50px;
            transition: transform 0.3s ease;
            max-width: 1200px;
            width: 95%;
            margin: 30px auto;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        .left-panel {
            background: #123e70;
            color: white;
            padding: 0px;
            width: 40%;
            text-align: center;
            border-radius: 20px;
        }
        .right-panel {
            padding: 40px;
            width: 60%;
        }
        h2 {
            margin-bottom: 30px;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }
        .btn-primary {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #0056b3, #004494);
        }
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
        }
      
        .form-group > div {
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
        .side-panel {
            background-image: url('../assets/images/doctors.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100%;
            border-radius: 15px;
            position: relative;
        }
        .side-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
        }
        .side-panel h2 {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .hero-image {
            width: 100%;
            margin-top: 20px;
            text-align: center;
        }
        .hero-image img {
            max-width: 80%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .terms-text {
            width: 100%;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: left;
            padding-left: 0;
            grid-column: 1 / -1;
        }
        .terms-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            width: 100%;
            grid-column: 1 / -1;
        }

        .terms-container input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
        }

        .terms-container label {
            font-size: 12px;
            color: #666;
            margin: 0;
            cursor: pointer;
            line-height: 14px;
        }
        .divider {
            width: 100%;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            line-height: 0.1em;
            margin: 25px 0;
        }

        .divider span {
            background: #fff;
            padding: 0 10px;
            color: #666;
            font-size: 14px;
        }

        .google-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .google-btn:hover {
            background-color: #f5f5f5;
        }

        .google-btn img {
            width: 18px;
            height: 18px;
            border-radius: 0;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>Doctor's Directory</h1>
            <p>Book Appointments, Consult via Video Call & Chat</p>
            <div class="hero-image">
                <img src="images/SignUp.png" alt="Doctors Team" />
            </div>
        </div>
        <div class="right-panel">
            <h2>Change Password</h2>
            <form id="ChangePasswordForm">
                
               
               
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Enter OTP">

                <input type="password" id="password" placeholder="New Password" required>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                
                
               
                <button type="submit" class="btn-primary">Change Password</button>
                
              
                <p style="font-size: 12px;"><a href="index.html">Go back to Sign in</a></p>
            </form>
            
            
            
        </div>
    </div>
    <script>    
        document.getElementById('ChangePasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
        
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirmPassword').value;
            let OTP=document.getElementById('OTP').value;
     ;
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            
        });
    </script>
</body>
</html>
