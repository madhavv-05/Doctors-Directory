<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {

        }

        }

        .search-results {

            margin: 30px auto;
            padding: 0 20px;
        }

        .verified-text {
            color: #666;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doctor-card {
            display: flex;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .doctor-image {
            position: relative;
            width: 100px;
        }

        .doctor-image img {
            width: 100%;
            border-radius: 8px;
        }

        .ad-badge {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 4px;
        }

        .badge {
            position: absolute;
            bottom: -10px;
            left: -10px;
            width: 40px !important;
            height: 40px;
            border-radius: 50% !important;
        }

        .doctor-info {
            flex: 1;
        }

        .doctor-info h2 {
            color: #00b5b7;
            margin-bottom: 10px;
        }

        .doctor-info p {
            margin-bottom: 8px;
            color: #666;
        }

        .rating {
            display: none;
        }

        .stories-link {
            color: #00b5b7;
            text-decoration: none;
            font-size: 14px;
            margin-top: 8px;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .call-btn, .book-btn, .contact-btn {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .call-btn {
            background: #00b5b7;
            color: white;
        }

        .book-btn {
            background: #00b5b7;
            color: white;
        }

        .contact-btn {
            border: 1px solid #00b5b7;
            background: white;
            color: #00b5b7;
        }

        .availability {
            color: #00b5b7;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .no-fee {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin: 0;
        }
        .filter-container {
    display: flex;

}

    position: relative;
}

.filter-btn {

}

.dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: #ffffff;
    color: #000;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 10px;
    z-index: 100;
    min-width: 200px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.dropdown label {
    display: block;
    margin-bottom: 8px;
}

    </style>
    <script>
function toggleDropdown(id) {
    document.querySelectorAll('.dropdown').forEach(el => {
        if (el.id !== id) el.style.display = 'none';
    });

    const dropdown = document.getElementById(id);
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
}

// Optional: Add event listener for sorting option change (placeholder)
document.addEventListener('DOMContentLoaded', () => {
    const sortRadios = document.querySelectorAll('input[name="sort"]');
    sortRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            const selectedSort = e.target.value;
            console.log('Selected sort:', selectedSort);
            // TODO: Implement sorting logic here
            // For now, just close the dropdown
            document.getElementById('sort-dropdown').style.display = 'none';
            // Update button text to selected option
            const sortButton = document.querySelector('.sort-group > .filter-btn');
            const label = e.target.parentElement.textContent.trim();
            sortButton.childNodes[0].textContent = label + ' ';
        });
    });
});

// Optional: Close dropdown when clicking outside
document.addEventListener('click', function(event) {
    const isClickInside = event.target.closest('.filter-group');
    if (!isClickInside) {
        document.querySelectorAll('.dropdown').forEach(el => el.style.display = 'none');
    }
});
</script>

</head>
<body>

    <div class="filter-nav">

    <!-- Experience Filter -->
    <div class="filter-group">

</div>

    <script>
        const doctorsData = [
            {
                id: 1,
                name: "Cosmetic Dental Clinic",
                profileLink: "DoctorProfile.html",
                specialty: "5 Dentist",
                experience: "4 - 29 years experience",
                location: "Indiranagar",
                fees: "₹300 - ₹600 Consultation Fees",
                imageSrc: "images/clinic-logo.png",
                imageAlt: "Cosmetic Dental Clinic",
                isAd: true,
                badges: [],
                availability: null,
                buttons: [
                    { type: "call", text: "Call Now" }
                ]
            },
            {
                id: 2,
                name: "Dr. Sumanth Shetty",
                profileLink: "DoctorProfile.html",
                specialty: "Dentist",
                experience: "26 years experience overall",
                location: "Koramangala,Bangalore • Chisel Dental",
                fees: "₹300 Consultation fee at clinic",
                imageSrc: "images/doctor-profile.jpg",
                imageAlt: "Dr. Sumanth Shetty",
                isAd: false,
                badges: [
                    { src: "images/practo-dental.png", alt: "Practo Dental" }
                ],
                availability: "Available Today",
                buttons: [
                    { type: "book", text: "Book Clinic Visit" },
                    { type: "contact", text: "Contact Clinic" }
                ]
            },
            {
                id: 2,
                name: "Dr. Sumanth Shetty",
                profileLink: "DoctorProfile.html",
                specialty: "Dentist",
                experience: "26 years experience overall",
                location: "Koramangala,Bangalore • Chisel Dental",
                fees: "₹300 Consultation fee at clinic",
                imageSrc: "images/doctor-profile.jpg",
                imageAlt: "Dr. Sumanth Shetty",
                isAd: false,
                badges: [
                    { src: "images/practo-dental.png", alt: "Practo Dental" }
                ],
                availability: "Available Today",
                buttons: [
                    { type: "book", text: "Book Clinic Visit" },
                    { type: "contact", text: "Contact Clinic" }
                ]
            }
        ];

        function createDoctorCard(doctor) {
            const card = document.createElement("div");
            card.className = "doctor-card";

            // Doctor Image container
            const imageContainer = document.createElement("div");
            imageContainer.className = "doctor-image";

            const img = document.createElement("img");
            img.src = doctor.imageSrc;
            img.alt = doctor.imageAlt;
            imageContainer.appendChild(img);

            if (doctor.isAd) {
                const adBadge = document.createElement("span");
                adBadge.className = "ad-badge";
                adBadge.textContent = "AD";
                imageContainer.appendChild(adBadge);
            }

            // Badges
            doctor.badges.forEach(badge => {
                const badgeImg = document.createElement("img");
                badgeImg.className = "badge";
                badgeImg.src = badge.src;
                badgeImg.alt = badge.alt;
                imageContainer.appendChild(badgeImg);
            });

            card.appendChild(imageContainer);

            // Doctor Info container
            const info = document.createElement("div");
            info.className = "doctor-info";

            const name = document.createElement("h2");
            const nameLink = document.createElement("a");
            nameLink.href = doctor.profileLink;
            nameLink.textContent = doctor.name;
            name.appendChild(nameLink);
            info.appendChild(name);

            const specialty = document.createElement("p");
            specialty.className = "specialty";
            specialty.textContent = doctor.specialty;
            info.appendChild(specialty);

            const experience = document.createElement("p");
            experience.className = "experience";
            experience.textContent = doctor.experience;
            info.appendChild(experience);

            const location = document.createElement("p");
            location.className = "location";
            location.textContent = doctor.location;
            info.appendChild(location);

            const fees = document.createElement("p");
            fees.className = "fees";
            fees.textContent = doctor.fees;
            info.appendChild(fees);

            card.appendChild(info);

            // Action Buttons container
            const actions = document.createElement("div");
            actions.className = "action-buttons";

            if (doctor.availability) {
                const availability = document.createElement("div");
                availability.className = "availability";
                const calendarIcon = document.createElement("i");
                calendarIcon.className = "fas fa-calendar-check";
                availability.appendChild(calendarIcon);
                availability.appendChild(document.createTextNode(" " + doctor.availability));
                actions.appendChild(availability);
            }

            doctor.buttons.forEach(button => {
                const btn = document.createElement("button");
                btn.className = button.type + "-btn";
                btn.textContent = button.text;
                actions.appendChild(btn);
            });

            card.appendChild(actions);

            return card;
        }

        function renderDoctors() {
            const container = document.querySelector(".search-results");
            const resultsCount = document.getElementById("results-count");
            resultsCount.textContent = `${doctorsData.length} Dentists available in Bangalore`;

            // Remove existing doctor cards if any
            const existingCards = container.querySelectorAll(".doctor-card");
            existingCards.forEach(card => card.remove());

            // Append new doctor cards dynamically
            doctorsData.forEach(doctor => {
                const card = createDoctorCard(doctor);
                container.appendChild(card);
            });
        }

        // Render doctors on page load
        document.addEventListener("DOMContentLoaded", renderDoctors);
    </script>
</body>
